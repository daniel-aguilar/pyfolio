[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyfolio"
dynamic = ["version"]
requires-python = "~=3.14.6"
dependencies = [
    "django~=5.2",
    "django-bootstrap5~=26.2",
    "dj-database-url~=3.1",
    "django-s3-storage~=0.15",
    "pillow~=12.3",
    "psycopg[binary]~=3.3",
    "python-dotenv~=1.2",
    "gunicorn~=26.0",
    "whitenoise~=6.12",
]

[project.optional-dependencies]
dev = [
    "coverage>=7",
    "django-extensions>=4",
    "freezegun>=1",
    "model-bakery>=1",
    "ruff~=0.16.5",
]

[tool.hatch.version]
path = "pyfolio/__init__.py"

[tool.uv]
required-version = "~=0.11"

[tool.ruff]
exclude = [
    "manage.py",
    "pyfolio/settings",
    "emr/migrations",
    "base_site/migrations",
]

[tool.ruff.lint]
ignore = [
    "RUF012", # Django model configuration
]

[tool.coverage.run]
source = [
    "emr"
]
