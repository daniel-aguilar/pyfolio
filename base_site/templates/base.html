{% load static django_bootstrap5  %}

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    {% bootstrap_javascript %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.9/handlebars.min.js"
            integrity="sha512-GtI6FQZ0Ib4zEqjdfaGxhj9vLt60i/qiR+GsVlEt9N77OJFn1wFaW3xPH8gE/tgTiguqJKE7TbK7J0gWUp3ERg=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.datatables.net/v/bs5/jq-3.7.0/dt-3.0.2/datatables.min.js"
            integrity="sha384-pVMdL5LQ8yjdIsGtUp1OvRYQltj7brPG2S8lisZqIzLUGQNfUuO64KdaBIFUcCx0" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.10.0/js/bootstrap-datepicker.min.js"
            integrity="sha512-LsnSViqQyaXpD4mBBdRYeP6sRwJiJveh2ZIbW41EBrNmKxgr/LFZIiWT6yr+nycvhvauz8c2nYMhrP80YhG7Cw=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.10.0/locales/bootstrap-datepicker.es.min.js"
            integrity="sha512-5pjEAV8mgR98bRTcqwZ3An0MYSOleV04mwwYj2yw+7PBhFVf/0KcE+NEox0XrFiU5+x5t5qidmo5MgBkDD9hEw=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    {% bootstrap_css %}
    <link href="https://cdn.datatables.net/v/bs5/jq-3.7.0/dt-3.0.2/datatables.min.css" rel="stylesheet"
            integrity="sha384-Oj7/vUb22fjYPHRAvqBq2eabsotv+7MpRbjyJOAduaCxqcjUAnPOea87WrOFsd0k" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.10.0/css/bootstrap-datepicker.min.css"
            integrity="sha512-34s5cpvaNG3BknEWSuOncX28vz97bRI59UnVtEEpFX536A7BtZSJHsDyFoCl8S7Dt2TPzcrCEoHBGeM4SUBDBw=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="{% static 'css/base.css' %}" type="text/css" media="all" />
    <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon" />
    {% block head %}{% endblock %}
    <title>Folio</title>
  </head>

  <body>
    {{ LANGUAGE_CODE|json_script:"app-lang" }}
    {% include "navbar.html" %}
    <div class="container">
      {% block content %}{% endblock %}
    </div>
    {% include "footer.html" %}
  </body>
</html>
